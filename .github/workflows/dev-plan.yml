name: Terraform Dev Plan

on:
  pull_request:
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/dev-plan.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: environments/dev

jobs:
  terraform-dev-plan:
    name: Terraform Dev Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/terraform-github-actions
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color | tee plan.txt

      - name: Add plan to summary
        run: |
          {
            echo "## Terraform Dev Plan"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
       
      - name: Comment Terraform Plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Terraform Dev Plan"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } > plan-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file plan-comment.md