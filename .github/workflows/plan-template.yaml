name: Terraform Plan

on:
  workflow_call:
    inputs:
      target-env:
        description: Environment dev or prod
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TARGET_ENV: ${{ inputs.target-env }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Validate environment
        run: |
          if [[ "$TARGET_ENV" != "dev" && "$TARGET_ENV" != "prod" ]]; then
            echo "Error: Invalid environment '$TARGET_ENV'. Allowed values: dev, prod."
            exit 1
          else
            echo "WORK_DIR=environments/$TARGET_ENV" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: $WORK_DIR
        run: terraform init

      - name: Terraform Plan
        working-directory: $WORK_DIR
        run: terraform plan -input=false -no-color | tee plan.txt

      - name: Add plan to summary
        run: |
          {
            echo "## Terraform $TARGET_ENV Plan"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
       
      - name: Comment Terraform Plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Terraform $TARGET_ENV Plan"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } > plan-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file plan-comment.md